# Complete runtime example. Copy to ~/.config/cast/cast.conf and edit device paths.
# Literal values; no shell expansion. Whole-line comments only.

[output]
backend = xorg
device = /dev/video10
width = 1920
height = 1080
fps = 30
enabled = true
pause_color = #20252b
pause_text = Paused

[camera]
device = /dev/video0
enabled = true
visible = true
shape = rounded
anchor = bottom-right
aspect = native
width_percent = 22
margin = 24
radius = 24
border_width = 2
border_color = #ffffff
x = 0
y = 0
crop_x = 0
crop_y = 0
mirror = true
corner_order = bottom-right,bottom-left,top-left,top-right

[composition]
layout = overlay
layout_order = overlay,split,screen,camera
split_side = left
split_ratio = 25
fit = contain
preset_order = coding,demo,conversation

[capture]
monitor =
kind = monitor
x = 0
y = 0
width = 0
height = 0

[zoom]
factor = 2
min = 1
max = 8
step = 0.25
transition_ms = 250
follow = true
deadzone = 80
smoothing = 0.18

[cursor]
enabled = true
highlight = false
size = 24
color = #ffcc33

[clicks]
enabled = false
duration_ms = 600
radius = 40
left_color = #ffcc33
right_color = #3399ff
middle_color = #cc66ff
middle = false

[keys]
enabled = false
mode = shortcuts
position = bottom-left
font_size = 24
timeout_ms = 1800
color = #ffffff
background = #20252b
filter = Super+Pause,Super+F9,Super+F10,Super+F11,Super+F12,Super+Shift+P,Super+Shift+R,Super+P,Super+Shift+Space,Super+Shift+C,Super+=,Super+-,Super+Shift+A,Super+Shift+L,Super+Shift+D,Super+Shift+M,Super+Shift+S,Super+Z,Super+Shift++,Super+Shift+_,Super+Shift+K,Super+Shift+B,Super+Shift+V,Ctrl+Super+Shift+R,Ctrl+Super+Shift+S,Ctrl+Super+F,Ctrl+Super+Shift+F
navigation = Left,Right,Up,Down,Home,End,Page_Up,Page_Down,Escape,Tab,Return,BackSpace,Delete

[annotations]
live_keys = true
live_clicks = true
record_keys = true
record_clicks = true

[audio]
mic = false
desktop = false
mic_source =
desktop_source =
mic_gain = 1
desktop_gain = 1
virtual = false
virtual_name = cast-microphone

[record]
directory = .
container = matroska
video_codec = libx264
audio_codec = aac
crf = 23
preset = veryfast
countdown = 0
queue = 8

[preview]
enabled = false
target = live

[ipc]
socket =
timeout_ms = 5000

[preset.coding]
layout = screen

[preset.demo]
layout = overlay
camera_shape = circle
camera_width_percent = 18

[preset.conversation]
layout = camera

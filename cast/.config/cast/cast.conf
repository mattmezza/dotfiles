# Complete runtime example. Copy to ~/.config/cast/cast.conf and edit device paths.
# Literal values; no shell expansion. Whole-line comments only.

[output]
backend = xorg
device = /dev/video10
width = 1920
height = 1080
fps = 30
enabled = true
pause_background = #20252b
pause_title = Paused
pause_subtitle = The live stream will resume soon...
pause_footer = {datetime:%A, %d %B · %H:%M}
pause_font = Noto Sans
pause_foreground = #ffffff
pause_title_size = 48
pause_subtitle_size = 24
pause_footer_size = 18
pause_text_gap = 12
blur_title = {datetime:%A, %d %B · %H:%M}
blur_subtitle = The live stream will resume soon...
blur_footer =
blur_font = Noto Sans
blur_color = #101113
blur_foreground = #ffffff
blur_radius = 32
blur_opacity = 0.60
blur_title_size = 48
blur_subtitle_size = 24
blur_footer_size = 18
blur_text_gap = 12

[camera]
device = /dev/video0
enabled = true
visible = true
shape = rounded
anchor = top-right
aspect = 1:1
width_percent = 18
margin = 20
radius = 30
border_width = 0
border_color = #ffffff
background = blurred
background_color = #20252b
background_blur_radius = 96
background_brightness = 0.25
x = 0
y = 0
crop_x = 0
crop_y = 0
mirror = true
corner_order = top,top-left,left,bottom-left,bottom,bottom-right,right,top-right

[composition]
layout = overlay
layout_order = overlay,split,screen,camera
split_side = left
split_ratio = 25
fit = contain
preset_order = coding,demo,conversation

[capture]
monitor =
kind = monitor
x = 0
y = 0
width = 0
height = 0

[zoom]
factor = 2
min = 1
max = 8
step = 0.25
transition_ms = 250
follow = true
deadzone = 80
smoothing = 0.18

[cursor]
enabled = true
highlight = false
size = 24
color = #ffcc33

[clicks]
enabled = false
duration_ms = 600
radius = 40
left_color = #ffcc33
right_color = #3399ff
middle_color = #cc66ff
middle = false

[keys]
enabled = false
mode = all
position = bottom-left
font_size = 24
timeout_ms = 1800
color = #ffffff
background = #20252b
filter = Alt+Super+Return,Alt+Super+Shift+Q,Alt+Super+V,Alt+Super+Space,Alt+Super+P,Alt+Super+Shift+P,Alt+Super+C,Alt+Super+A,Alt+Super+Z,Alt+Super+B,Alt+Super+K,Alt+Super+R,Alt+Super+Shift+R,Alt+Super+Shift+Space,Alt+Super+T,Alt+Super+L,Alt+Super+Shift+L
navigation = Left,Right,Up,Down,Home,End,Page_Up,Page_Down,Escape,Tab,Return,BackSpace,Delete

[annotations]
live_keys = true
live_clicks = true
record_keys = true
record_clicks = true

[audio]
mic = false
desktop = false
mic_source =
desktop_source =
mic_gain = 1
desktop_gain = 1
virtual = false
virtual_name = cast-microphone

[record]
# No home expansion here; sxhkd starts cast with --record-dir "$HOME/screenshots".
directory = .
container = matroska
video_codec = libx264
audio_codec = aac
crf = 23
preset = veryfast
countdown = 5
queue = 8

[preview]
enabled = false
target = live

[ipc]
socket =
timeout_ms = 5000

[preset.coding]
layout = screen

[preset.demo]
layout = overlay
camera_shape = circle
camera_width_percent = 18

[preset.conversation]
layout = camera
